<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歴史演習">
<title>歴史総合 中間テスト演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
.gate{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.gate input{font:inherit;font-size:1.4rem;letter-spacing:.3em;text-align:center;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.gate .err{color:var(--ng);min-height:1.5em;font-size:.9rem}
/* Layout: 左に設定レール、右に1問ずつのカード。プリントの薄緑の紙と、オレンジの書き込み（赤シートで消える色）がモチーフ */
:root{
  --paper:#eaf0ec; --sheet:#f8fbf8; --ink:#1d2b28; --muted:#5d6e69; --line:#c9d6d0;
  --teal:#1f5f5b; --teal-soft:#d5e6e2; --orange:#e2571c; --orange-soft:#fbe4d8;
  --ok:#1f7a4d; --ok-soft:#d8efe1; --ng:#b8322a; --ng-soft:#f6dcd9; --warn:#a86a00; --warn-soft:#f6ead0;
  --redsheet:#c7362f;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b1a; --sheet:#1c2624; --ink:#e3ebe8; --muted:#9aaba6; --line:#33433f;
  --teal:#7cc4bc; --teal-soft:#21403c; --orange:#ff8a52; --orange-soft:#3d2519;
  --ok:#6fd39c; --ok-soft:#1b3a2a; --ng:#ff8d84; --ng-soft:#42201d; --warn:#f0bf5a; --warn-soft:#3b2f15;
  --redsheet:#a8302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141b1a; --sheet:#1c2624; --ink:#e3ebe8; --muted:#9aaba6; --line:#33433f;
  --teal:#7cc4bc; --teal-soft:#21403c; --orange:#ff8a52; --orange-soft:#3d2519;
  --ok:#6fd39c; --ok-soft:#1b3a2a; --ng:#ff8d84; --ng-soft:#42201d; --warn:#f0bf5a; --warn-soft:#3b2f15;
  --redsheet:#a8302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,2.6vw,2rem);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:18px;max-width:560px;width:100%;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px)}
aside .seg{background:var(--paper)}
.modes button{padding:14px 16px;font-size:1.05rem}
.modes button:hover{border-color:var(--teal);background:var(--teal-soft)}
.back{font-weight:700;text-decoration:none;font-size:.95rem}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--teal);font:inherit;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer}
.speak svg{width:15px;height:15px;fill:currentColor}
.speak:hover{border-color:var(--teal)}
.group{display:flex;flex-direction:column;gap:6px}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1 1 auto;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--sheet);font-weight:700}
.seg button:hover:not([aria-pressed="true"]){background:var(--teal-soft)}
.modes{display:flex;flex-direction:column;gap:6px}
.modes button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
.modes button .n{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.modes button[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:700}
.modes button small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;line-height:1.4}
select{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--teal)}
.weakbox{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{border:0;background:none;color:var(--teal);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

main{min-width:0}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,32px);box-shadow:0 1px 0 var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:700}
.chip.weak{background:var(--orange-soft);color:var(--orange)}
.chip.hint{background:var(--warn-soft);color:var(--warn)}
.progress{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.sentence{font-size:clamp(1.05rem,1.6vw,1.22rem);line-height:2.1;max-width:44em}
.blank{display:inline-block;min-width:5.5em;text-align:center;border-bottom:3px solid var(--orange);color:var(--orange);font-weight:700;padding:0 .3em;margin:0 .15em}
.blank.done{border-color:var(--ok);color:var(--ok)}
.blank.miss{border-color:var(--ng);color:var(--ng)}
.filled{color:var(--muted);border-bottom:1px dotted var(--muted)}
.question{font-family:var(--f-display);font-weight:600;font-size:clamp(1.15rem,1.8vw,1.35rem);line-height:1.8;margin:0;max-width:40em;text-wrap:pretty}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;cursor:pointer;min-width:0}
.choice:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}
.choice .k{flex:none;width:1.7em;height:1.7em;display:grid;place-items:center;border-radius:6px;background:var(--paper);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}
.inputrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.inputrow input{flex:1 1 240px;min-width:0;font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--teal);background:var(--teal);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.small{padding:7px 14px;font-size:.9rem}
.feedback{margin-top:20px;padding:14px 16px;border-radius:10px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-soft)} .feedback.ng{background:var(--ng-soft)} .feedback.mid{background:var(--warn-soft)}
.feedback strong{font-size:1.05rem}
.feedback .ans{font-size:1.25rem;font-weight:700;color:var(--orange)}
.feedback .rd{color:var(--muted);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.kbd{font-size:.78rem;color:var(--muted)}
.model{margin-top:20px;border-left:4px solid var(--orange);background:var(--orange-soft);padding:14px 18px;border-radius:0 10px 10px 0;line-height:1.95;max-width:46em}
.model .lb{font-size:.75rem;letter-spacing:.12em;color:var(--orange);font-weight:700;display:block;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted);margin-top:10px}
.self{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.self button{font:inherit;border-radius:10px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.self .g{border-color:var(--ok);color:var(--ok)} .self .m{border-color:var(--warn);color:var(--warn)} .self .b{border-color:var(--ng);color:var(--ng)}

.result h2{font-family:var(--f-display);font-size:1.6rem;margin:0 0 4px}
.score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal);line-height:1.2}
.score span{font-size:1.2rem;color:var(--muted)}
.misslist{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:6px}
.misslist li{display:flex;gap:12px;align-items:baseline;padding:8px 12px;background:var(--paper);border-radius:8px;flex-wrap:wrap}
.misslist b{color:var(--orange);min-width:8em}
.misslist .s{color:var(--muted);font-size:.85rem;flex:1 1 20em;min-width:0}

/* 赤シート */
.sheettools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.sec{margin-top:26px}
.sec:first-of-type{margin-top:0}
.sec h3{font-family:var(--f-display);font-size:1.15rem;margin:0 0 8px;color:var(--teal)}
.sec h4{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.para{margin:0 0 12px;line-height:2.2;max-width:46em}
.rs{display:inline-flex;align-items:baseline;gap:.25em;border:0;font:inherit;cursor:pointer;padding:0 .4em;margin:0 .1em;border-radius:4px;background:var(--redsheet);color:transparent;min-width:4.5em;justify-content:center;line-height:1.6}
.rs .no{color:#fff;font-size:.72em;font-weight:700;opacity:.9}
.rs .tx{color:transparent}
.rs.open{background:transparent;color:var(--orange);border-bottom:2px solid var(--orange);border-radius:0}
.rs.open .tx{color:var(--orange);font-weight:700}
.rs.open .no{color:var(--muted)}
.rs.isweak:not(.open){box-shadow:0 0 0 2px var(--orange)}
.streak{display:inline-block;align-self:flex-start;margin-top:6px;padding:2px 12px;border-radius:999px;background:var(--orange);color:var(--sheet);font-weight:700;font-size:.9rem;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.feedback.ok strong{display:inline-block;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.rankrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rank{font-weight:800;font-family:var(--f-display);font-size:1.1rem;padding:4px 14px;border-radius:10px;border:2px solid var(--teal);color:var(--teal);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.rank.rS,.rank.rA{border-color:var(--orange);color:var(--orange)}
.confetti{position:fixed;top:-16px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.streak,.rank,.feedback.ok strong{animation:none}}
.rangebox{display:flex;flex-direction:column;gap:8px}
.rangebox button{font:inherit;font-size:.88rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.rangebox button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--sheet);font-weight:700}
.rangebox button:hover:not([aria-pressed="true"]){border-color:var(--teal)}
.rrow{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:8px;align-items:start}
.rch{font-weight:700;color:var(--muted);font-size:.85rem;padding-top:7px}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
.vid{display:flex;flex-direction:column;gap:12px}
.vstage{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,2.5vw,28px);min-height:min(72vh,660px);display:flex;flex-direction:column;gap:14px}
.vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vhead h2{font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0;text-wrap:balance}
.vbody{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start;flex:1}
.vbody.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){.vbody{grid-template-columns:minmax(0,1fr)}}
.vvis{min-width:0}
.vvis .fig{margin:0}
.vvis .mapsvg{min-width:0}
.vcards{display:flex;flex-direction:column;gap:10px;min-width:0}
.vcards:empty{display:none}
.vcard{padding:12px 14px;border-radius:10px;background:var(--paper);border-left:4px solid var(--line);font-size:clamp(1rem,1.6vw,1.15rem);line-height:1.65;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s,background .3s,border-color .3s}
.vcard.on{opacity:1;transform:none}
.vcard.cur{border-left-color:var(--orange);background:var(--orange-soft)}
.vcard b{color:var(--orange)}
.vtitle{display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:220px;padding:10px 4px}
.vtitle .big{font-family:var(--f-display);font-size:clamp(1.8rem,4.2vw,3rem);font-weight:800;line-height:1.3;color:var(--teal);text-wrap:balance}
.vtitle .sm{color:var(--muted);font-size:1rem}
.vsub{min-height:3.6em;padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--sheet);font-size:clamp(.98rem,1.5vw,1.1rem);line-height:1.6}
.vctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vctl .ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--teal);display:grid;place-items:center;cursor:pointer;padding:0}
.vctl .ic svg{width:22px;height:22px;fill:currentColor}
.vctl .ic.play{width:58px;height:58px;background:var(--teal);border-color:var(--teal);color:var(--sheet)}
.vprog{display:flex;gap:3px;flex:1 1 220px;min-width:0}
.vprog button{flex:1;height:12px;border:0;border-radius:3px;background:var(--line);cursor:pointer;padding:0;min-width:0}
.vprog button.done{background:var(--teal)}
.vprog button.now{background:var(--orange)}
.vtime{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.vcard{transition:none}}
.figs{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.fig{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:14px 16px;min-width:0}
.fig h5{margin:0 0 10px;font-size:.85rem;letter-spacing:.08em;color:var(--teal)}
.fig .cap{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.mapwrap{overflow-x:auto}
.mapsvg{width:100%;min-width:560px;height:auto;display:block;border-radius:8px}
.mapsvg .sea{fill:var(--teal-soft)}
.mapsvg .land{fill:var(--sheet);stroke:var(--line);stroke-width:1.5}
.mapsvg .rg{fill:var(--muted);font-size:26px;opacity:.45;font-weight:700}
.mapsvg .pt circle{fill:var(--muted)}
.mapsvg .pt text{fill:var(--muted);font-size:19px}
.mapsvg .pt .ld{stroke:var(--muted);stroke-width:1;opacity:.6}
.mapsvg .pt.hl circle{fill:var(--orange);stroke:var(--sheet);stroke-width:3}
.mapsvg .pt.hl text{fill:var(--ink);font-weight:700;font-size:21px}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:.92rem}
.tl .y,.bars .y{font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal)}
.tl .tag{font-size:.72rem;padding:0 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal);margin-left:6px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.bars .row{display:grid;grid-template-columns:4.2em minmax(0,1fr) 3.4em;gap:4px 10px;align-items:center}
.bars .b{display:block;height:14px;background:var(--orange);border-radius:3px;min-width:3px}
.bars .v{font-variant-numeric:tabular-nums;text-align:right}
.bars .c{grid-column:2/4;color:var(--muted);font-size:.8rem}
.tbl{overflow-x:auto}
table.su{border-collapse:collapse;font-size:.9rem;width:100%}
.su th,.su td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.su th{color:var(--muted);font-weight:700;font-size:.8rem}
.me3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.me3{grid-template-columns:minmax(0,1fr)}}
.me3 .ag{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.me3 .ag b{color:var(--orange)}
.me3 .to{font-size:.8rem;color:var(--muted)}
.me3note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--ng-soft);font-size:.9rem}
.figbox{margin:4px 0 12px}
.figbox summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:.9rem}
footer{margin-top:28px;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="gate" hidden>
  <div class="gate card">
    <h1>歴史総合 中間テスト演習</h1>
    <span class="sub">パスワードを入力してください</span>
    <input id="pw" type="password" inputmode="numeric" maxlength="4" aria-label="パスワード">
    <span class="err" id="pwErr"></span>
    <button class="btn" id="pwGo">はじめる</button>
  </div>
</div>


<div class="wrap" id="appWrap" hidden>
  <header class="top">
    <h1>歴史総合 中間テスト演習</h1>
    <span class="sub">5. アジアのナショナリズム ／ 6. 大衆の政治参加</span>
  </header>
  <div class="grid">
    <aside>
      <div class="group">
        <span class="label">範囲</span>
        <div class="rangebox" id="range" role="group" aria-label="範囲"></div>
      </div>
      <div class="group" id="methodGroup">
        <span class="label">答え方（穴埋め・本文から）</span>
        <div class="seg" id="method">
          <button data-v="choice">4択</button><button data-v="input">手入力</button>
        </div>
      </div>
      <div class="group" id="orderGroup">
        <span class="label">出題順</span>
        <div class="seg" id="order">
          <button data-v="seq">プリント順</button><button data-v="rand">ランダム</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="tts"> 問題を音声で読み上げる</label>
      <label class="check"><input type="checkbox" id="sfx"> 効果音を鳴らす</label>
      <div class="group"><span class="label">読み上げの速さ</span><div class="seg" id="rate"><button data-v="1">1倍</button><button data-v="1.1">1.1倍</button><button data-v="1.2">1.2倍</button><button data-v="1.3">1.3倍</button><button data-v="1.4">1.4倍</button><button data-v="1.5">1.5倍</button></div></div>

  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
    const sc=v=>(/premium|enhanced|natural|neural|プレミアム|拡張/i.test(v.name)?10:0)+(/nanami|keita|google|o-ren|kyoko|siri|hattori/i.test(v.name)?3:0)+(v.localService?1:0);
    jaVoice=vs.sort((a,b)=>sc(b)-sc(a))[0]||null;
  }catch(e){}
}

let actx=null;
function sfx(kind){
  if(settings.sfx===false) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t0=actx.currentTime+0.01;
    const tone=(f,st,dur,type,vol)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t0+st); g.gain.setValueAtTime(0.0001,t0+st); g.gain.exponentialRampToValueAtTime(vol||0.22,t0+st+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur); o.connect(g); g.connect(actx.destination); o.start(t0+st); o.stop(t0+st+dur+0.05); };
    if(kind==="ok"){ tone(1318.5,0,0.35); tone(2637,0,0.2,"sine",0.06); tone(1046.5,0.16,0.75); tone(2093,0.16,0.4,"sine",0.06); }
    else if(kind==="ng"){ tone(196,0,0.18,"square",0.06); tone(185,0.22,0.32,"square",0.06); }
    else if(kind==="fanfare"){ [523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,i*0.11,0.3,"triangle",0.2)); tone(1046.5,0.44,0.9,"triangle",0.2); tone(1318.5,0.44,0.9,"sine",0.12); tone(1568,0.44,0.9,"sine",0.08); }
    else if(kind==="clear"){ [784,1046.5,1318.5].forEach((f,i)=>tone(f,i*0.1,0.5,"triangle",0.18)); }
  }catch(e){}
}

  for(let i=0;i<60;i++){
    const d=document.createElement("i"); d.className="confetti";
    d.style.left=(Math.random()*100)+"vw"; d.style.background=cols[i%cols.length];
    document.body.appendChild(d);
    const dx=(Math.random()-.5)*160, rot=Math.random()*720-360, dur=1400+Math.random()*1200;

let sayToken=0;
function say(text,force,cb){
  if(!canSpeak || (!settings.tts && !force) || !text){ if(cb) setTimeout(cb, canSpeak?0:Math.max(1500,String(text||"").length*130)); return; }
  try{
    speechSynthesis.cancel();
    const my=++sayToken, r=parseFloat(settings.rate)||1;
    const parts=yomi(String(text)).split("\u0001");
    const speakPart=i=>{
      if(my!==sayToken || i>=parts.length) return;
      const t=parts[i].replace(/[［］\[\]＝]/g,"、").replace(/（|）/g,"、");
      const goNext=()=>{ if(my!==sayToken) return; if(i<parts.length-1) setTimeout(()=>speakPart(i+1), Math.round(700/r)); else if(cb) cb(); };
      if(!t.replace(/[、\s]/g,"")){ goNext(); return; }
      const u=new SpeechSynthesisUtterance(t);
      u.lang="ja-JP"; if(jaVoice) u.voice=jaVoice; u.rate=r; u.pitch=1;
      u.onend=goNext;
      speechSynthesis.speak(u);
    };
    speakPart(0);
  }catch(e){}
}

function mapFig(groups){
  const hl=groups.split("+");
  const svg=MAP_SVG.replace(/class="pt" data-k="(\w+)" data-g="(\w+)"/g,(m,k,g)=>(hl.includes(g)||hl.includes(k))?`class="pt hl" data-k="${k}" data-g="${g}"`:m);
  return `<div class="fig"><h5>地図で確認</h5><div class="mapwrap">${svg}</div><p class="cap">オレンジの点がこの範囲に関係する場所です（国境線は省略）。</p></div>`;
}

  "t21":["suffrage_world"],"t22":["suffrage_world"],"t27":["electorate"],"t29":["electorate"],
  "e6-Q5":[],"e6-Q6":[],"e6-Q11":["electorate"],"e6-Q12":["electorate"],"e6-Q13":["suffrage_world"],"e6-Q14":["suffrage_world","electorate"],"e6-アプローチ②":["electorate","suffrage_world"]

function figsFor(it){
  if(FIGMAP[it.id]) return FIGMAP[it.id];
  if(it.id[0]==="t" && /何年/.test(it.q)) return [it.ch===5?"tl_asia":"tl_japan"];
  return SECFIG[it.sec]||[];
}
function figHtml(keys){
  if(!keys||!keys.length) return "";
  return `<div class="figs">${keys.map(k=>k.startsWith("map:")?mapFig(k.slice(4)):(FIG_RENDER[k]?FIG_RENDER[k]():"")).join("")}</div>`;
}
function renderFigs(){
  hush();
  $("#main").innerHTML = BACK+`<div class="card"><p class="note" style="margin-top:0">テスト範囲の場所・年代・しくみを図でまとめました。</p>${figHtml(["map:east+india+west","tl_asia","me3","suffrage_world","electorate","tl_japan"])}</div>`;
}

  ["以上でまとめは終わりです。テスト、がんばってください！","**がんばって！**"]]}
];
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>'};
let V={i:0,k:-1,playing:false,tok:0,wl:null};
const mdB = t => t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function vVisual(v){
  if(v.startsWith("map:")) return mapFig(v.slice(4));
  if(v.startsWith("fig:")) return FIG_RENDER[v.slice(4)]();
  const [a,b]=v.slice(6).split("|");
  return `<div class="vtitle"><span class="big">${a}</span><span class="sm">${b||""}</span></div>`;
}
function renderVideo(){
  V.tok++; V.playing=false; V.k=-1;
  $("#main").innerHTML = BACK+`<div class="vid"><div class="vstage" id="vstage"></div>
  <div class="vctl"><button class="ic" id="vprev" aria-label="前の場面">${ICON.prev}</button><button class="ic play" id="vplay" aria-label="再生">${ICON.play}</button><button class="ic" id="vnext" aria-label="次の場面">${ICON.next}</button>
  <div class="vprog" id="vprog">${VIDEO.map((s,i)=>`<button data-i="${i}" aria-label="${i+1}. ${s.t}"></button>`).join("")}</div><span class="vtime" id="vnum"></span></div>
  <p class="note" style="margin:0">▶で再生。スペースキーで一時停止、←→で場面を移動できます。速さはメニューの「読み上げの速さ」で変えられます。</p></div>`;
  $("#vplay").onclick=()=>V.playing?vPause():vPlay();
  $("#vprev").onclick=()=>vGo(V.i-1,true);
  $("#vnext").onclick=()=>vGo(V.i+1,true);
  $("#vprog").querySelectorAll("button").forEach(b=>b.onclick=()=>vGo(+b.dataset.i,true));
  vDraw();
}
function vDraw(){
  const s=VIDEO[V.i]; const cards=s.s.filter(x=>x[1]);
  const solo = s.v.startsWith("title:") && !cards.length;
  $("#vstage").innerHTML = `<div class="vhead"><span class="chip">${s.c}</span><h2>${s.t}</h2></div>
   <div class="vbody${solo?" solo":""}"><div class="vvis">${vVisual(s.v)}</div><div class="vcards">${s.s.map((x,k)=>x[1]?`<div class="vcard" data-k="${k}">${mdB(x[1])}</div>`:"").join("")}</div></div>
   <div class="vsub" id="vsub">${V.playing?"":"▶ を押すと始まります"}</div>`;
  vMark();
  $("#vprog").querySelectorAll("button").forEach((b,i)=>{b.className=i<V.i?"done":i===V.i?"now":"";});
  $("#vnum").textContent=`${V.i+1} / ${VIDEO.length}`;
  $("#vplay").innerHTML=V.playing?ICON.pause:ICON.play; $("#vplay").setAttribute("aria-label",V.playing?"一時停止":"再生");
}
function vMark(){
  document.querySelectorAll(".vcard").forEach(c=>{const k=+c.dataset.k; c.classList.toggle("on",k<=V.k); c.classList.toggle("cur",k===V.k);});
}
function vSeg(k){
  const s=VIDEO[V.i]; const my=++V.tok;
  if(k>=s.s.length){ setTimeout(()=>{ if(my!==V.tok||!V.playing) return; if(V.i<VIDEO.length-1){ V.i++; V.k=-1; vDraw(); vSeg(0);} else { V.playing=false; vDraw(); $("#vsub").textContent="おしまい。おつかれさまでした！"; sfx("fanfare"); confetti(); } }, Math.round(900/(parseFloat(settings.rate)||1))); return; }
  V.k=k; vMark(); $("#vsub").textContent=s.s[k][0];
  let done=false; const fin=()=>{ if(done||my!==V.tok||!V.playing) return; done=true; setTimeout(()=>{ if(my===V.tok&&V.playing) vSeg(k+1); }, Math.round(450/(parseFloat(settings.rate)||1))); };
  say(s.s[k][0],true,fin);
  setTimeout(fin, Math.round((s.s[k][0].length*260+4000)/(parseFloat(settings.rate)||1)));
}
async function vPlay(){
  V.playing=true; vDraw();
  try{ if(navigator.wakeLock&&!V.wl) V.wl=await navigator.wakeLock.request("screen"); }catch(e){}
  vSeg(V.k<0?0:V.k);
}
function vPause(){ V.playing=false; V.tok++; hush(); vDraw(); $("#vsub").textContent="一時停止中（▶で続きから）"; }
function vGo(i,keep){ if(i<0||i>=VIDEO.length) return; const was=V.playing; V.tok++; hush(); V.i=i; V.k=-1; V.playing=was; vDraw(); if(was) vSeg(0); }
function vStop(){ V.tok++; V.playing=false; try{ V.wl&&V.wl.release(); }catch(e){} V.wl=null; }

// ===== 出題 =====
const inRange = it => settings.range==="all" || String(it.ch)===settings.range || it.sec===settings.range;
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let Q = {list:[],i:0,score:0,miss:[],answered:false,retry:false};

function start(list){
  if(settings.mode==="sheet") return renderSheet();
  if(settings.mode==="figs") return renderFigs();
  if(settings.mode==="video") return renderVideo();
  let pool;
  if(settings.mode==="mock"){
    pool = list || shuffle([...shuffle(blankItems.filter(inRange)).slice(0,24), ...shuffle(textItems.filter(inRange)).slice(0,6)]);
  } else {
    pool = settings.mode==="blank"?blankItems:settings.mode==="text"?textItems:essayItems;
    pool = list || pool.filter(inRange).filter(it=>!settings.weakOnly||weak[it.id]);
    if(!list && settings.order==="rand") pool = shuffle(pool);
  }
  Q = {list:pool,i:0,score:0,miss:[],answered:false,t0:Date.now(),streak:0,best:0};
  if(!pool.length){
    $("#main").innerHTML = BACK+`<div class="card"><p class="question">${settings.weakOnly?"この範囲に苦手な問題はありません。":"この範囲には問題がありません。"}</p><p class="note">${settings.weakOnly?"間違えた問題が自動で苦手に登録されます。「苦手だけ出題する」を外して解いてみましょう。":""}</p></div>`;
    return;
  }
  renderQ();
}

function metaHtml(it,extra=""){
  const s = secById[it.sec];
  const pct = Math.round(Q.i/Q.list.length*100);
  return `<div class="meta"><span class="chip">${s.ch}. ${s.name}</span>${extra}${weak[it.id]?'<span class="chip weak">苦手</span>':''}${speakBtn}<span class="progress">${Q.i+1} / ${Q.list.length}　正解 ${Q.score}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function sentenceHtml(it,state){
  return it.sentence.replace(/\[\[(\d+)\]\]/g,(m,n)=>{
    n=+n;
    if(n===it.n){
      const cls = state==="ok"?"blank done":state==="ng"?"blank miss":"blank";
      const txt = state? getB(it.ch,n)[0] : `${n}`;
      return `<span class="${cls}">${txt}</span>`;
    }
    return `<span class="filled">${getB(it.ch,n)[0]}</span>`;
  });
}

function makeChoices(correct,cat,custom,ch){
  let d = custom && custom.length ? custom.slice() : [];
  if(d.length<3){
    const same=[]; [5,6].forEach(c=>Object.values(B[c]).forEach(b=>{ if(b[2]===cat && b[0]!==correct) same.push(b[0]); }));
    (EXTRA[cat]||[]).forEach(x=>{ if(x!==correct) same.push(x); });
    shuffle([...new Set(same)]).forEach(x=>{ if(d.length<3 && !d.includes(x)) d.push(x); });
  }
  return shuffle([correct,...d.slice(0,3)]);
}

function renderQ(){
  const it = Q.list[Q.i]; Q.answered=false;
  const m = settings.mode;
  if(m==="essay") return renderEssay(it);
  let correct, qHtml, alts=[], reading="", choices;
  if(isB(it)){
    const b=getB(it.ch,it.n); correct=b[0]; reading=b[1]; alts=b[3]||[];
    qHtml = `<p class="sentence">${sentenceHtml(it)}</p>`;
    choices = makeChoices(correct,b[2],b[4],it.ch);
  } else {
    correct=it.a; qHtml=`<p class="question">${it.q}</p>`; choices = shuffle([it.a,...it.d]);
  }
  const chipExtra = isB(it)?`<span class="chip">（${it.n}）</span>`:"";
  let body = BACK+`<div class="card">${metaHtml(it,chipExtra)}${qHtml}`;
  if(settings.method==="choice"){
    body += `<div class="choices">${choices.map((c,i)=>`<button class="choice" data-c="${c}"><span class="k">${i+1}</span><span>${c}</span></button>`).join("")}</div>`;
  } else {
    body += `<form class="inputrow" id="f"><input id="ans" autocomplete="off" placeholder="答えを入力して Enter" aria-label="答え"><button class="btn">答え合わせ</button></form>`;
  }
  body += `<div id="fb"></div></div>`;
  $("#main").innerHTML = body;
  lastSpeech = isB(it) ? spokenSentence(it) : it.q;
  say(lastSpeech);
  if(settings.method==="choice"){
    document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>judgeChoice(btn,correct,it));
  } else {
    const inp=$("#ans"); inp.focus();
    $("#f").onsubmit=e=>{e.preventDefault(); if(!Q.answered) judgeInput(inp.value,correct,alts,reading,it);};
  }
}

function judgeChoice(btn,correct,it){
  if(Q.answered) return; Q.answered=true;
  const ok = btn.dataset.c===correct;
  document.querySelectorAll(".choice").forEach(b=>{ b.disabled=true; if(b.dataset.c===correct) b.classList.add("right"); });
  if(!ok) btn.classList.add("wrong");
  finish(ok?"ok":"ng",correct,it);
}
function judgeInput(v,correct,alts,reading,it){
  if(!v.trim()) return;
  Q.answered=true;
  const nv=norm(v);
  const ok = [correct,...alts].some(a=>norm(a)===nv);
  const kana = !ok && reading && norm(reading)===nv;
  finish(ok?"ok":kana?"kana":"ng",correct,it,v);
}
function finish(res,correct,it,typed){
  if(res==="ok") Q.score++; else Q.miss.push(it);
  markWeak(it.id,res!=="ok");
  if(isB(it)){ const s=$(".sentence"); if(s) s.innerHTML=sentenceHtml(it,res==="ok"?"ok":"ng"); }
  let reading = isB(it) ? getB(it.ch,it.n)[1] : "";
  const alts = isB(it) ? (getB(it.ch,it.n)[3]||[]) : [];
  const msg = res==="ok"?"正解！":res==="kana"?"読みは正解。テストでは漢字で書けるようにしよう":"不正解";
  const cls = res==="ok"?"ok":res==="kana"?"mid":"ng";
  const showRd = reading && !/^[ぁ-ん]+$/.test(correct) && !/^[ァ-ンヴー＝・]+$/.test(correct) && !/^\d+$/.test(correct);
  $("#fb").innerHTML = `<div class="feedback ${cls}"><strong>${msg}</strong>${res!=="ok"||settings.method==="input"?`<span class="ans">${correct}</span>`:""}${showRd?`<span class="rd">よみ：${reading}</span>`:""}${alts.length?`<span class="rd">別の書き方：${alts.join("、")}</span>`:""}${typed&&res!=="ok"?`<span class="rd">あなたの答え：${typed.replace(/</g,"&lt;")}</span>`:""}</div>
  <div class="actions"><button class="btn" id="next">次へ</button>${res!=="ok"&&typed?'<button class="btn ghost small" id="override">合っていたので正解にする</button>':''}<span class="kbd">Enter で次へ</span></div>`;
  $("#fb").insertAdjacentHTML("beforeend", figHtml(figsFor(it)));
  $("#next").onclick=next; $("#next").focus();
  const spokenAns = (isB(it) ? getB(it.ch,it.n)[1] : correct);
  if(res==="ok"){ Q.streak=(Q.streak||0)+1; Q.best=Math.max(Q.best||0,Q.streak); } else Q.streak=0;
  const big = res==="ok" && Q.streak%5===0;
  sfx(res==="ok"?(big?"fanfare":"ok"):"ng");
  if(res==="ok" && Q.streak>=3) showStreak(Q.streak);
  if(big) confetti();
  const tk=sayToken; setTimeout(()=>{ if(tk===sayToken) say(res==="ok" ? "正解。"+spokenAns : "正解は、"+spokenAns); }, big?1400:700);
  const ov=$("#override"); if(ov) ov.onclick=()=>{ sfx("ok"); Q.score++; Q.miss.pop(); markWeak(it.id,false); markWeak(it.id,false); ov.remove(); $(".feedback").className="feedback ok"; $(".feedback strong").textContent="正解にしました"; };
}
function next(){ Q.i++; if(Q.i>=Q.list.length) return renderResult(); renderQ(); }

function renderEssay(it){
  $("#main").innerHTML = BACK+`<div class="card">${metaHtml(it,`<span class="chip">${it.label}</span>${it.flag?'<span class="chip hint">プリントに「出るかも？」のメモ</span>':''}`)}
  <p class="question">${it.q}</p>
  <p class="note">頭の中かノートに答えを書いてから、模範解答を見よう。${/[①-⑮]/.test(it.q)?"資料番号は授業プリント・資料集を参照。":""}</p>
  <div class="actions"><button class="btn" id="show">模範解答を見る</button><span class="kbd">Enter でも開けます</span></div><div id="fb"></div></div>`;
  $("#show").onclick=()=>{
    Q.answered=true;
    $("#show").parentElement.remove();
    hush();
    $("#fb").innerHTML = `<div class="model"><span class="lb">模範解答（プリントの書き込み）</span>${it.a}${canSpeak?`<div style="margin-top:8px"><button class="speak" id="readModel">${SPK}模範解答を読み上げる</button></div>`:""}</div>${figHtml(figsFor(it))}
    <div class="self"><button class="g" data-r="g">書けた</button><button class="m" data-r="m">だいたい書けた</button><button class="b" data-r="b">書けなかった</button></div>`;
    const rm=$("#readModel"); if(rm) rm.onclick=()=>say(it.a,true);
    document.querySelectorAll(".self button").forEach(b=>b.onclick=()=>{
      const r=b.dataset.r; if(r==="g"){ Q.score++; sfx("ok"); } else Q.miss.push(it);
      markWeak(it.id,r!=="g"); next();
    });
  };
  $("#show").focus();
  lastSpeech = it.q; say(lastSpeech);
}

function renderResult(){
  const total=Q.list.length, pct=Math.round(Q.score/total*100);
  const rk = pct===100?"S":pct>=90?"A":pct>=80?"B":pct>=60?"C":"D";
  const msg = pct===100?"全問正解！テスト本番もこの調子で。":pct>=80?"よくできています。間違えたところだけもう一度。":pct>=50?"あと少し。間違えた問題を繰り返そう。":"まずは赤シートで本文を読み直してから再挑戦しよう。";
  const missHtml = Q.miss.map(it=>{
    if(isB(it)){ const b=getB(it.ch,it.n); return `<li><b>${b[0]}</b><span class="s">${it.ch}章（${it.n}） ${it.sentence.replace(/\[\[(\d+)\]\]/g,(m,n)=>+n===it.n?"（　　）":getB(it.ch,+n)[0]).slice(0,70)}…</span></li>`; }
    if(it.id[0]==="t") return `<li><b>${it.a}</b><span class="s">${it.q}</span></li>`;
    return `<li><b>${it.ch}章 ${it.label}</b><span class="s">${it.q}</span></li>`;
  }).join("");
  $("#main").innerHTML = BACK+`<div class="card result"><div class="rankrow"><h2>${settings.mode==="mock"?"模擬テストの結果":"結果"}</h2><span class="rank r${rk}">ランク ${rk}</span></div><div class="score">${settings.mode==="mock"?`${pct}<span> 点（${Q.score} / ${total}問）</span>`:`${Q.score}<span> / ${total}問（${pct}%）</span>`}</div><p class="note">最高 ${Q.best||0}問連続正解　かかった時間：${Math.floor((Date.now()-Q.t0)/60000)}分${Math.round((Date.now()-Q.t0)/1000)%60}秒</p><p>${msg}</p>
  <div class="actions">${Q.miss.length?'<button class="btn" id="retry">間違えた問題だけもう一度</button>':''}<button class="btn ghost" id="again">最初からもう一度</button><button class="btn ghost" data-back>メニューへ</button></div>
  ${Q.miss.length?`<ul class="misslist">${missHtml}</ul>`:""}</div>`;
  const r=$("#retry"); if(r) r.onclick=()=>start(Q.miss.slice());
  $("#again").onclick=()=>start();
  hush();
  if(pct===100){ sfx("fanfare"); confetti(); } else if(pct>=80) sfx("clear");
}

// ===== 赤シート =====
function renderSheet(){
  const secs = SECS.filter(s=>settings.range==="all"||String(s.ch)===settings.range||s.id===settings.range);
  let lastCh=0, html=BACK+`<div class="card"><div class="sheettools"><button class="btn small" id="openAll">全部めくる</button><button class="btn ghost small" id="closeAll">全部かくす</button><span class="kbd">赤いところをタップすると答えが出ます（読み上げONなら読みも流れます）。オレンジ枠は苦手な問題。</span></div>`;
  secs.forEach(s=>{
    const head = s.ch!==lastCh ? `<h4>${s.ch===5?"5. アジアのナショナリズム":"6. 大衆の政治参加"}</h4>`:""; lastCh=s.ch;
    const fk=SECFIG[s.id]||[];
    html += `<section class="sec">${head}<h3>《${s.name}》</h3>${fk.length?`<details class="figbox"><summary>図を見る</summary>${figHtml(fk)}</details>`:""}${s.paras.map(p=>`<p class="para">○${p.replace(/\[\[(\d+)\]\]/g,(m,n)=>{const b=getB(s.ch,+n);return `<button class="rs${weak[`b${s.ch}-${n}`]?" isweak":""}" data-rd="${b[1]}" aria-label="（${n}）答えを見る"><span class="no">${n}</span><span class="tx">${b[0]}</span></button>`;})}</p>`).join("")}</section>`;
  });
  html += `</div>`;
  $("#main").innerHTML = html;
  document.querySelectorAll(".rs").forEach(b=>b.onclick=()=>{ b.classList.toggle("open"); if(b.classList.contains("open")) say(b.dataset.rd); });
  $("#openAll").onclick=()=>document.querySelectorAll(".rs").forEach(b=>b.classList.add("open"));
  $("#closeAll").onclick=()=>document.querySelectorAll(".rs").forEach(b=>b.classList.remove("open"));
}

// ===== キーボード =====
document.addEventListener("keydown",e=>{
  if(view!=="play") return;
  if(e.key==="Escape"){ showMenu(); return; }
  if(settings.mode==="video"){
    if(e.key===" "){ e.preventDefault(); V.playing?vPause():vPlay(); }
    else if(e.key==="ArrowRight") vGo(V.i+1); else if(e.key==="ArrowLeft") vGo(V.i-1);
    return;
  }
  if(settings.mode==="sheet"||settings.mode==="figs") return;
  const tag=(e.target.tagName||"");
  if(/^[1-4]$/.test(e.key) && tag!=="INPUT" && !Q.answered){
    const b=document.querySelectorAll(".choice")[+e.key-1]; if(b){ b.click(); e.preventDefault(); }
  }
  if(e.key==="Enter" && tag!=="INPUT" && tag!=="BUTTON"){
    const n=$("#next")||$("#show"); if(n){ n.click(); e.preventDefault(); }
  }
});

const PW="0764";
function unlock(){ $("#gate").hidden=true; $("#appWrap").hidden=false; showMenu(); }
let authed=false; try{ authed=localStorage.getItem("rekishi_auth")==="1"; }catch(e){}
if(authed) unlock(); else {
  $("#gate").hidden=false; $("#pw").focus();
  const go=()=>{ if($("#pw").value===PW){ try{localStorage.setItem("rekishi_auth","1");}catch(e){} unlock(); } else $("#pwErr").textContent="パスワードがちがいます"; };
  $("#pwGo").onclick=go; $("#pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}
</script>
